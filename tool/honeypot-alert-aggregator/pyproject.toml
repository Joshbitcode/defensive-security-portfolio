[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpa"
version = "0.1.0"
description = "蜜罐告警聚合器：归一化、去重、汇总（防御向学习工具）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hpa = "hpa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
