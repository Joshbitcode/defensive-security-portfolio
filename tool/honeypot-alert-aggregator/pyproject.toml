[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpa"
version = "0.1.0"
description = "Honeypot alert aggregator: normalization, deduplication, and summarization (a defense-oriented learning tool)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hpa = "hpa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
