# honeypot-alert-aggregator configuration example
# Copy to config.toml and adjust as needed. Every key has an implementation-side default.

[dedup]
# Time window (seconds) in which same-source, same-type, same-payload events count as duplicates
window_seconds = 300

[store]
# sqlite3 state database path (relative to the working directory, or absolute)
path = "hpa.db"

[report]
# Default report window in hours for the report command
default_window_hours = 24
# Number of source IPs shown in the report, ordered by event count
top_n = 20
